# Build the gsemr (R binding) pkgdown documentation site and publish it to
# GitHub Pages. Adapted from the standard r-lib/actions pkgdown workflow, with
# the Rust staticlib build steps the package needs before it can be installed.
on:
  push:
    branches: [master, main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only publish on pushes/releases to the default branch, not on PRs (PRs
    # build the site to catch errors but don't deploy).
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/r/src/rust

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Generate the compatibility/architecture article vignettes from the
      # repo-root markdown (single source of truth) before the package is
      # resolved and the site is built.
      - name: Generate article vignettes
        working-directory: bindings/r
        run: Rscript tools/build-vignettes.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build Rust staticlib
        working-directory: bindings/r/src/rust
        run: cargo build --release

      - name: Install gsemr
        working-directory: bindings/r
        run: |
          cp src/rust/target/release/libgsemr.a src/
          R CMD INSTALL .
        env:
          _R_CHECK_FORCE_SUGGESTS_: false

      - name: Build site
        working-directory: bindings/r
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: bindings/r/docs
